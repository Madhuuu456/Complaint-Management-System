<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madhu Complaint Management System</title><link rel="stylesheet" href="css/style.css"></head><body data-page="submit"><header id="h"></header><main>
<form id="submit" class="card form"><h2>New complaint</h2><label>Title</label><input name="title" required><label>Category</label><select name="category"><option>General</option><option>Service</option><option>Billing</option><option>Technical</option><option>Facilities</option></select><label>Priority</label><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><label>Description</label><textarea name="description" rows="5" required></textarea><button class="btn">Submit complaint</button></form><div id="done" class="form"></div>
</main><footer id="f"></footer><script src="js/app.js"></script></body></html>
